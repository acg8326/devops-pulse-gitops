apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-pulse-backend
  labels:
    app: devops-pulse
    component: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: devops-pulse
      component: backend
  template:
    metadata:
      labels:
        app: devops-pulse
        component: backend
    spec:
      containers:
        - name: backend
          image: nginx:alpine
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "200m"
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 20
